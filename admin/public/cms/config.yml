          name: label
          widget: string
          required: false
        - label: Link
          name: href
          widget: string
          required: false
          hint: Leave both blank for no button.
        required: false
        label: Badge link
        name: badgeLink
      - label: Heading
        name: heading
        widget: string
      - label: Text
        name: body
        widget: text
      - widget: object
        fields:
        - label: Button text
          name: label
          widget: string
        - label: Link
          name: href
          widget: string
