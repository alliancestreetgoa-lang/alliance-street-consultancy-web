# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
#
# Content editor for the Alliance Street Consultancy website (Sveltia CMS).
#
# HOW PUBLISHING WORKS
#   Every save goes to a draft (a branch + pull request), never straight to the
#   live site. Each draft gets a real preview build of the whole site. A draft
#   goes live only when someone allowed to publish merges it; GitHub enforces
#   who that is (see docs/cms-setup.md → "Roles"). Every publish is a commit, so
#   every change is attributable and can be rolled back.
#
# WHERE THIS FILE IS READ FROM
#   The admin is hosted separately from the public site (Firebase Hosting), and
#   loads this file from the main branch on GitHub. Changing it here and
#   merging is enough; the admin does not need redeploying.
#
# Kept out of the CMS on purpose:
#   - advisor credentials (ACCA numbers and the like) — checkable against public
#     registers, added in code with the certificate in hand
#   - the four enquiry service categories — the database rules validate them
#
# Everything saved here is validated before it can publish (tests/content.test.ts).

#
# Written without YAML anchors or merge keys on purpose: the YAML 1.2 parser in
# the browser does not support `<<:` merges, and fields defined that way vanish.


site_url: https://alliancestreetgoa-lang.github.io/alliance-street-consultancy-web
display_url: https://alliancestreetgoa-lang.github.io/alliance-street-consultancy-web
logo_url: https://raw.githubusercontent.com/alliancestreetgoa-lang/alliance-street-consultancy-web/main/public/brand/logo-mark.png
backend:
  name: github
  repo: alliancestreetgoa-lang/alliance-street-consultancy-web
  branch: main
  base_url: https://REPLACE-ME.workers.dev
  squash_merges: true
  preview_context: Preview
  commit_messages:
    create: Create {{collection}} “{{slug}}”
    update: Update {{collection}} “{{slug}}”
    delete: Delete {{collection}} “{{slug}}”
    uploadMedia: Upload “{{path}}”
    deleteMedia: Delete “{{path}}”
publish_mode: editorial_workflow
editor:
  preview: false
media_folder: public/brand
public_folder: /brand
media_libraries:
  # No stock-photo sources: placeholder services (Lorem Picsum) are not real
  # imagery, and third-party photos need their licence checked by a person.
  stock_assets:
    providers: []
  default:
    config:
      max_file_size: 41943040
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 2400
          height: 2400
collections:
- name: pages
  label: Pages
  label_singular: Page
  icon: description
  description: Every page on the site. Open a page to edit its sections — add, reorder (drag), duplicate,
    hide or remove them. Core pages (Home, About, Services, …) can be edited but not deleted or moved.
  folder: src/content/pages
  format: json
  extension: json
  create: true
  delete: true
  identifier_field: title
  slug: '{{title}}'
  summary: '{{title}} — {{path}}'
  sortable_fields:
  - title
  - path
  preview_path: '{{path}}'
  fields:
  - label: Page name
    name: title
    widget: string
    hint: Used in menus, breadcrumbs and search results.
  - label: Web address
    name: path
    widget: string
    pattern:
    - ^/([a-z0-9]+(-[a-z0-9]+)*(/[a-z0-9]+(-[a-z0-9]+)*)*)?$
    - Start with / then lowercase words and hyphens, e.g. /uae-guide
    hint: For a new page, e.g. /uae-guide. Do not change the address of an existing page — links and search
      rankings break.
  - label: Status
    name: status
    widget: select
    default: published
    options:
    - label: Published — visible on the site
      value: published
    - label: Hidden — not built, returns “page not found”
      value: hidden
    hint: Hide a page before removing it. Menus may not link to a hidden page.
  - label: Layout
    name: layout
    widget: select
    default: standard
    options:
    - label: Standard
      value: standard
    - label: Flowing bands (home page style)
      value: flow
  - label: Search & sharing
    name: seo
    widget: object
    collapsed: true
    fields:
    - label: Search title
      name: title
      widget: string
      required: false
      hint: About 50–60 characters. Leave blank on the home page to use the site default.
    - label: Search description
      name: description
      widget: text
      required: false
      hint: One or two plain sentences, under 160 characters. Describe the page honestly.
    - label: Social sharing image
      name: image
      widget: object
      summary: '{{fields.alt}}'
      fields:
      - label: Image
        name: src
        widget: image
        choose_url: false
        hint: Upload a JPG, PNG or WebP. It is resized and optimised automatically.
      - label: Description for screen readers (alt text)
        name: alt
        widget: string
        hint: Say what the image shows, in one sentence.
      - label: Focus point
        name: position
        widget: select
        default: center
        options:
        - label: Centre
          value: center
        - label: Top
          value: top
        - label: Bottom
          value: bottom
        - label: Left
          value: left
        - label: Right
          value: right
        hint: Which part of the photo stays visible when it is cropped on small screens.
      required: false
      hint: Shown when the page is shared on LinkedIn, WhatsApp, etc. Defaults to the site sharing image.
    - label: Hide from search engines
      name: noindex
      widget: boolean
      default: false
      hint: Adds noindex and leaves the page out of the sitemap.
    - label: Last reviewed
      name: lastReviewed
      widget: datetime
      format: YYYY-MM-DD
      date_format: DD MMMM YYYY
      time_format: false
      hint: Update when the content meaningfully changes. Used in the sitemap.
