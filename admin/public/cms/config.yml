        widget: string
        required: false
      - label: Client approved publication
        name: approved
        widget: boolean
        hint: Only tick when the client has agreed to be quoted.
      hint: Only approved quotes from real clients who agreed to be quoted are published.
  - name: theme
    label: Brand & appearance
    file: src/content/theme.json
    fields:
    - label: Accent colour
      name: accent
      widget: select
      options:
      - label: Alliance red (default)
        value: alliance-red
      - label: Deep crimson
        value: crimson
      - label: Burgundy
        value: burgundy
      hint: Vetted presets only, so every choice stays readable and on-brand. Changes apply to the whole
        site.
    - label: Typeface
      name: font
      widget: select
      options:
      - label: Inter (brand)
        value: inter
      - label: System font (fastest)
        value: system
    - label: Text size
      name: textSize
      widget: select
      options:
      - label: Standard
        value: standard
      - label: Larger
        value: large
    - label: Space between sections
      name: sectionSpacing
      widget: select
      options:
      - label: Compact
        value: compact
      - label: Standard
        value: standard
      - label: Spacious
        value: spacious
    - label: Animation
      name: motion
      widget: select
      options:
      - label: Full (visitors who prefer reduced motion still get none)
        value: full
      - label: Off for everyone
        value: 'off'
    - label: Opening logo animation on first load
      name: openingAnimation
      widget: boolean
