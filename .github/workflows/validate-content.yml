name: Validate content

# Runs on every draft (pull request) — the CMS opens one for each saved change.
# "Publish check" is a required status on main: a draft that fails it cannot be
# published. When it finishes, deploy-pages.yml rebuilds the draft's preview.
on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-check:
    name: Publish check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Content first and on its own: this is the check an editor's draft is
      # about, so its failure reads "Content schemas", not "Build".
      - name: Content schemas, links and media
        run: npm run validate:content

      # src/lib/image-manifest.json is generated, and the types depend on it.
      - name: Image variants
        run: npm run optimize:images

      - name: Types
        run: npx tsc --noEmit && npx tsc -p admin/tsconfig.json

      - name: Lint
        run: npm run lint

      - name: Full test suite
        run: npm test

      # Proves the change actually produces a site, not just valid JSON.
      - name: Build static export
        env:
          NEXT_PUBLIC_BASE_PATH: /alliance-street-consultancy-web
          NEXT_PUBLIC_SITE_URL: https://alliancestreetgoa-lang.github.io
        run: npm run build

  security-rules:
    name: Database security rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm run test:rules
