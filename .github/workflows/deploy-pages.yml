name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        env:
          NEXT_PUBLIC_BASE_PATH: /alliance-street-consultancy-web
          # Absolute origin for canonicals, sitemap <loc> values, OG URLs and
          # schema @id. Set explicitly so it is a decision rather than a
          # fallback in src/lib/site-url.ts.
          #
          # When moving to a custom domain: change this to that origin, add
          # public/CNAME, and DELETE the NEXT_PUBLIC_BASE_PATH line above —
          # basePath must be empty when serving from a domain root, or every
          # canonical will carry a /alliance-street-consultancy-web segment
          # that does not exist there.
          NEXT_PUBLIC_SITE_URL: https://alliancestreetgoa-lang.github.io
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
